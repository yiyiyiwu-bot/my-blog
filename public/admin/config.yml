# 後台設定檔
# repo 跟 base_url 這兩個值,要等我們把 GitHub repo 建好、Cloudflare Worker 部署好之後才會填上正確的值。
# 目前先放預留位置,還不能登入,等 Phase B 設定好會回來改這裡。

backend:
  name: github
  repo: REPLACE_WITH_GITHUB_USERNAME/REPLACE_WITH_REPO_NAME
  branch: main
  base_url: REPLACE_WITH_WORKER_URL

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "文章"
    label_singular: "文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "發布日期", name: "pubDate", widget: "datetime" }
      - label: "分類"
        name: "category"
        widget: "select"
        options: ["生活", "隨筆", "攝影", "其他"]
      - { label: "標籤", name: "tags", widget: "list", default: [], required: false }
      - { label: "封面圖", name: "coverImage", widget: "image", required: false }
      - { label: "封面圖說明", name: "coverImageAlt", widget: "string", required: false, hint: "給視障讀者跟搜尋引擎看的簡短描述" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false, hint: "顯示在文章列表卡片上的一小段預覽文字" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, hint: "打勾的話,文章不會公開顯示在網站上" }
      - { label: "內文", name: "body", widget: "markdown" }
