backend:
  name: github
  repo: yiyiyiwu-bot/my-blog
  branch: main
  base_url: https://sveltia-cms-auth.yiyiyiwu.workers.dev

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "文章"
    label_singular: "文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    view_groups:
      - label: "依分類"
        field: category
    sortable_fields: [pubDate, title, category]
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "發布日期", name: "pubDate", widget: "datetime" }
      - label: "分類"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        hint: "從「分類管理」裡已經建立好的分類挑選"
      - { label: "標籤", name: "tags", widget: "list", default: [], required: false }
      - { label: "封面圖", name: "coverImage", widget: "image", required: false }
      - { label: "封面圖說明", name: "coverImageAlt", widget: "string", required: false, hint: "給視障讀者跟搜尋引擎看的簡短描述" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false, hint: "顯示在文章列表卡片上的一小段預覽文字" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, hint: "打勾的話,文章不會公開顯示在網站上" }
      - label: "內文字體"
        name: "fontFamily"
        widget: "select"
        default: "default"
        hint: "整篇文章內文套用的字體(新細明體/標楷體/微軟正黑體只在 Windows 裝置上會正確顯示,思源宋體則不管什麼裝置都看得到)"
        options:
          - { label: "預設", value: "default" }
          - { label: "新細明體", value: "pmingliu" }
          - { label: "標楷體", value: "biaukai" }
          - { label: "微軟正黑體", value: "jhenghei" }
          - { label: "思源宋體", value: "notoserif" }
      - label: "內文字級"
        name: "fontSize"
        widget: "select"
        default: "normal"
        hint: "整篇文章內文的文字大小"
        options:
          - { label: "小", value: "small" }
          - { label: "正常", value: "normal" }
          - { label: "大", value: "large" }
          - { label: "特大", value: "xlarge" }
      - { label: "內文", name: "body", widget: "markdown" }

  - name: "categories"
    label: "分類管理"
    label_singular: "分類"
    folder: "src/content/categories"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "分類名稱", name: "title", widget: "string" }
      - { label: "介紹文字", name: "description", widget: "markdown", required: false, hint: "介紹這個分類是在寫什麼" }
      - { label: "密碼保護", name: "password", widget: "string", required: false, hint: "設定密碼後,訪客要輸入這組密碼才能看這個分類底下的文章列表。留空表示公開,誰都能看" }
      - { label: "密碼提示文字", name: "passwordHint", widget: "markdown", required: false, hint: "顯示在密碼輸入框上方的說明文字" }

  - name: "pages"
    label: "頁面內容"
    files:
      - name: "articles"
        label: "文章首頁"
        file: "src/content/pages/articles.md"
        fields:
          - { label: "側邊欄名稱", name: "sidebarLabel", widget: "string", required: false, hint: "顯示在分類側邊欄第一個項目的名稱,預設是「文章首頁」" }
          - { label: "標題", name: "title", widget: "string", required: false }
          - { label: "介紹文字", name: "intro", widget: "markdown", required: false, hint: "點「文章」進去、還沒選分類時看到的文字。選取文字後可以用工具列的連結按鈕加超連結" }
          - label: "文字字體"
            name: "fontFamily"
            widget: "select"
            default: "default"
            required: false
            hint: "這段介紹文字套用的字體(只在有安裝該字體的裝置上會正確顯示,例如 Windows 電腦)"
            options:
              - { label: "預設", value: "default" }
              - { label: "新細明體", value: "pmingliu" }
              - { label: "標楷體", value: "biaukai" }
              - { label: "微軟正黑體", value: "jhenghei" }
          - label: "文字字級"
            name: "fontSize"
            widget: "select"
            default: "normal"
            required: false
            hint: "這段介紹文字的大小"
            options:
              - { label: "小", value: "small" }
              - { label: "正常", value: "normal" }
              - { label: "大", value: "large" }
              - { label: "特大", value: "xlarge" }
      - name: "contact"
        label: "聯絡我們"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "標題", name: "title", widget: "string", required: false }
          - { label: "介紹文字", name: "intro", widget: "markdown", required: false, hint: "顯示在「聯絡我們」頁面上的文字。選取文字後可以用工具列的連結按鈕加超連結" }
          - { label: "QR Code 圖片", name: "qrImage", widget: "image", required: false, hint: "例如 LINE 的 QR Code,上傳後會用小尺寸顯示在頁面上,方便訪客掃描" }
      - name: "homeIntro"
        label: "首頁導覽"
        file: "src/content/pages/home-intro.md"
        fields:
          - { label: "標題", name: "title", widget: "string", required: false }
          - { label: "內文", name: "intro", widget: "markdown", required: false, hint: "顯示在首頁中間的文字,標題可以留空。選取文字後可以用工具列的連結按鈕加超連結" }

  - name: "home"
    label: "首頁內容"
    label_singular: "首頁下方區塊"
    folder: "src/content/home"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields:
      fields: [order]
      default:
        field: order
        direction: ascending
    fields:
      - { label: "標題", name: "title", widget: "string", required: false }
      - { label: "首頁文案", name: "homeText", widget: "text", required: false, hint: "顯示在首頁下方那個區塊的一小段文字" }
      - { label: "圖片", name: "image", widget: "image", required: false }
      - label: "圖片位置"
        name: "imagePosition"
        widget: "select"
        options:
          - { label: "圖片在左", value: "left" }
          - { label: "圖片在右", value: "right" }
        default: "left"
        required: false
      - { label: "內文", name: "pageIntro", widget: "text", required: false, hint: "點 VIEW MORE 進去後看到的內容,細節之後可以再打磨" }
      - { label: "順序", name: "order", widget: "number", default: 100, required: false, hint: "數字越小排越前面。新增的區塊預設是 100,會排在後面;想調整順序就直接改這個數字" }
      - { label: "VIEW MORE 連結", name: "linkUrl", widget: "string", required: false, hint: "留空的話,會連到自動產生的頁面。想改連去別的地方(例如某一篇文章),就把網址貼在這裡,例如 /blog/文章網址" }
