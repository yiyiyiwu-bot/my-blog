<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}</style>
<title>點滴在心頭教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap">
<style>
/* 全螢幕 3D 場景，介面以毛玻璃卡片浮在四周；單一暖色黏土風格（刻意不做深色版） */
:root{
  --ink:#211d1d; --coral:#db6a41; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --paper:#fffdf9; --sand:#edddcf; --muted:#6d6260; --line:#e7dacd;
  --glass:rgba(255,251,247,.78); --glass-strong:rgba(255,250,246,.94);
  --shadow:0 1px 2px #4a2a1410, 0 6px 16px #4a2a1414, 0 24px 48px #4a2a1418;
  --chip-shadow:0 2px 8px #4a2a1414;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --num:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 38%,#fffdf9 0%,#f6ece2 55%,#edddcf 100%);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none}
.css2d{position:absolute;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
.btn{min-height:44px;min-width:44px;border:0;border-radius:9px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;transition:background .15s,color .15s}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.btn:focus-visible,.chip:focus-visible,.ilabel:focus-visible,.pin:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font:700 10px/1.2 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;box-shadow:var(--chip-shadow);padding:6px 12px;font-size:13px;cursor:pointer;min-height:32px}
.chip:hover{background:var(--yellow)}
.chip.cream{background:var(--cream)}

/* 品牌卡 */
.brand{position:fixed;top:16px;left:16px;width:286px;padding:14px 18px 14px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);z-index:5;box-sizing:border-box}
.brand h1{margin:4px 0 0;font-size:30px;line-height:1.1;letter-spacing:1px;font-weight:900}
.brand h1 small{display:block;font-size:14px;font-weight:700;color:var(--coral);letter-spacing:6px;margin-top:4px}
.brand .lang{position:absolute;top:10px;right:10px;min-height:32px;min-width:44px;font:700 11px var(--mono);letter-spacing:1px}
.tools{position:fixed;left:16px;top:132px;display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);z-index:5}
.tools .btn{flex-direction:column;gap:2px;font-size:11px;padding:4px 10px}

/* 詳細卡片 */
#card{position:fixed;left:16px;top:200px;bottom:112px;width:340px;border-radius:22px;background:var(--glass-strong);box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden}
#card .body{overflow:auto;padding:16px 20px 22px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 0 20px}
.card-title{display:flex;align-items:center;gap:12px}
.card-title h2{margin:0;font-size:22px;line-height:1.25;text-wrap:balance}
.icon{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--ink)}
.lead{margin:0;line-height:1.65;color:#3b3332}
.list{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.list button{width:100%;text-align:left;justify-content:flex-start;gap:10px;padding:8px 10px;min-height:44px;border-radius:12px;background:#fff;box-shadow:var(--chip-shadow)}
.list button .n{font-weight:900;color:var(--coral);width:18px;flex:none}
.list button .w{margin-left:auto;font:700 10px var(--mono);color:var(--muted);letter-spacing:1px}
.list button.lit{background:#fff7c9}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.item-top{display:flex;gap:14px;align-items:flex-start}
.thumb{width:110px;height:110px;flex:none;border-radius:16px;background:linear-gradient(#f7efe6,#efe1d2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.tile{background:#fff;border-radius:14px;box-shadow:var(--chip-shadow);padding:10px 10px 9px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font:italic 400 24px/1.05 var(--num);color:var(--coral);word-break:break-word}
.tile span{font-size:12px;line-height:1.4;color:#4d4442}
.axis{display:grid;grid-template-columns:repeat(3,1fr);position:relative;padding-top:14px}
.axis::before{content:"";position:absolute;left:8%;right:8%;top:20px;height:2px;background:var(--line)}
.axis div{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.axis i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--stone);z-index:1}
.axis .on{color:var(--ink);font-weight:700}
.axis .on i{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 4px #db6a4126}
.flowline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px;font-weight:800}
.ev{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.ev svg{width:46px;height:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

/* 清單側欄 */
/* 「要去哪？」選地點面板：佔半個畫面 */
#side{position:fixed;right:0;top:0;bottom:0;width:clamp(440px,50vw,760px);border-radius:28px 0 0 28px;background:rgba(255,250,246,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:-20px 0 60px #4a2a1426,var(--shadow);z-index:9;display:flex;flex-direction:column;overflow:hidden;animation:sideIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.side-top{padding:calc(18px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) 10px 32px;display:flex;flex-direction:column;gap:6px}
.side-top .row{display:flex;align-items:center;justify-content:space-between}
.side-title{margin:0;font:900 clamp(34px,4vw,48px)/1.15 var(--serif,serif);letter-spacing:2px}
.side-sub{margin:0;color:var(--muted);font-size:15px}
body.side-open #log, body.side-open #hud, body.side-open #legend{display:none}
/* 時間、名牌、搬運、協作線、暫停、鳥瞰、日誌這些工具先全部關掉 */
#hud, #timeBtn, #log, #legend{display:none!important}
#side .side-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:12px max(28px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 32px;align-content:start}
.dest{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;min-height:168px;padding:18px 18px 16px;border:0;border-radius:22px;background:#fff;box-shadow:var(--chip-shadow);cursor:pointer;font:inherit;color:var(--ink);overflow:hidden;transition:transform .18s,box-shadow .18s}
.dest::before{content:"";position:absolute;inset:0 0 auto 0;height:62px;background:var(--c);opacity:.55}
.dest:hover{transform:translateY(-3px);box-shadow:0 10px 26px #4a2a1424}
.dest:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.dest-ic{position:relative;width:52px;height:52px;border-radius:16px;background:var(--c);display:grid;place-items:center;font:900 24px var(--serif,serif);box-shadow:0 0 0 4px #fff}
.dest b{position:relative;font:900 24px/1.2 var(--serif,serif);letter-spacing:1px}
.dest-meta{font:700 10px var(--mono);letter-spacing:2px;color:var(--muted)}
.dest-sum{font-size:13px;line-height:1.6;color:#4d4442}
.dest-st{position:absolute;top:14px;right:14px;font:700 12px var(--sans);padding:4px 10px;border-radius:999px;background:#fff;box-shadow:var(--chip-shadow)}
.dest-st.done{background:#dff0e3;color:#2f7a4c}
.dest-st.soon{color:var(--muted)}
.dest.soon{opacity:.72}
.dest.feature{grid-column:1/-1;flex-direction:row;align-items:center;gap:18px;min-height:124px;background:linear-gradient(120deg,#fff8e0,#fff)}
.dest.feature::before{height:100%;width:8px;opacity:1}
.dest.feature .dest-ic{width:64px;height:64px;font-size:30px;flex:none}
.dest.feature .dest-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
/* 簡單版的地點卡：一個字＋名稱 */
#side .dest{flex-direction:row;align-items:center;gap:16px;min-height:92px;padding:16px 20px}
#side .dest::before{height:100%;width:8px;opacity:1}
#side .dest b{font-size:24px}
.tabs{display:flex;gap:4px;background:#f3e9df;border-radius:12px;padding:4px}
.tabs .btn{flex:1;min-height:38px;font-weight:700;font-size:13px}
.side-list{overflow:auto;padding:4px 14px 18px;display:flex;flex-direction:column;gap:6px}
details{background:#fff;border-radius:14px;box-shadow:var(--chip-shadow)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:28px;border-radius:14px}
summary::-webkit-details-marker{display:none}
summary .num{font:700 11px var(--mono);color:var(--muted);letter-spacing:1px}
summary b{flex:1}
summary .cnt{font-size:12px;color:var(--muted)}
details .list{padding:0 8px 10px}
details .list button{box-shadow:none;background:#faf5ef}
details .list button:hover{background:var(--yellow)}
.flowrow{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:10px 12px;min-height:44px;border:0;border-radius:14px;background:#fff;box-shadow:var(--chip-shadow);cursor:pointer}
.flowrow:hover{background:var(--yellow)}
.flowrow small{color:var(--muted)}

/* HUD */
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);z-index:7;white-space:nowrap}
#hud .clock{display:flex;flex-direction:column;align-items:center;padding:0 14px 0 16px;min-width:76px}
#hud .clock b{font:italic 400 24px/1 var(--num)}
#hud .clock span{font-size:11px;color:var(--muted);margin-top:3px}
#hud .sep{width:1px;height:30px;background:var(--line);margin:0 4px}
#hud .btn{flex-direction:column;gap:1px;font-size:11px;padding:2px 9px;min-width:50px;border-radius:999px}
#hud .btn svg{width:18px;height:18px}
#timeBtn{display:none}

/* 城市日誌 */
#log{position:fixed;top:16px;right:16px;width:300px;max-height:42vh;border-radius:18px;background:var(--glass-strong);box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden}
body.side-open #log{right:350px}
.log-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px}
.live{display:inline-flex;align-items:center;gap:6px;font:700 10px var(--mono);letter-spacing:2px;color:#2f7a4c}
.live i{width:8px;height:8px;border-radius:50%;background:#33b36b;box-shadow:0 0 0 0 #33b36b88;animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px #33b36b00}100%{box-shadow:0 0 0 0 #33b36b00}}
#logFilter{margin-left:auto;min-height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;max-width:130px}
#logList{list-style:none;margin:0;padding:0 12px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#logList li button{width:100%;display:grid;grid-template-columns:44px 1fr;gap:8px;text-align:left;border:0;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:12px;line-height:1.45}
#logList li button:hover{background:var(--yellow)}
#logList time{font:700 11px var(--mono);color:var(--muted)}
#logList .k{font:700 9px var(--mono);letter-spacing:1px;color:var(--coral);display:block}
.empty{color:var(--muted);font-size:12px;padding:6px 4px}

/* 圖例 */
#legend{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;display:flex;gap:16px;padding:8px 16px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--chip-shadow);z-index:6;font-size:12px;white-space:nowrap}

/* 3D 標籤 */
.ilabel{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--cream);box-shadow:var(--chip-shadow);font-size:13px;font-weight:700;white-space:nowrap;transition:opacity .2s,background .2s;border:0;font-family:var(--sans)}
.ilabel .num{font:700 10px var(--mono);background:var(--ink);color:var(--cream);border-radius:999px;padding:3px 6px;letter-spacing:1px}
.ilabel.num-only{padding:5px 6px}
.ilabel.num-only .nm{display:none}
.ilabel.sel{background:var(--ink);color:var(--cream)}
.ilabel.sel .num{background:var(--coral)}
.ilabel.dim{opacity:.45}
.pin{pointer-events:auto;cursor:pointer;width:28px;height:28px;border-radius:50%;border:2px solid var(--coral);background:#fff;color:var(--coral);font-weight:900;font-size:15px;display:grid;place-items:center;box-shadow:var(--chip-shadow);padding:0;font-family:var(--sans)}
.pin.sel{background:var(--coral);color:#fff}
.tag{background:#fff;border-radius:10px;padding:3px 8px;font-size:11px;box-shadow:var(--chip-shadow);white-space:nowrap;position:relative}
.tag::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#fff}

/* 載入與說明 */
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fffdf9,#edddcf);transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader .in{text-align:center;padding:24px;max-width:520px}
#loader h1{font-size:clamp(40px,9vw,76px);margin:0;letter-spacing:4px;font-weight:900;line-height:1.05}
#loader p{margin:14px 0 0;color:var(--muted);font-size:16px}
#loader .err{color:#a33a1f;font-weight:700;line-height:1.6}
#intro{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:#211d1d40;padding:16px}
#intro .box{width:min(440px,100%);box-sizing:border-box;background:var(--cream);border-radius:22px;box-shadow:var(--shadow);padding:24px}
#intro h2{margin:6px 0 16px;font-size:24px}
#intro ol{margin:0 0 20px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
#intro li{display:flex;gap:12px;align-items:flex-start;line-height:1.55}
#intro li b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--num);font-style:italic;font-size:16px}
#intro .go{width:100%;background:var(--ink);color:var(--cream);font-weight:700}
#intro .go:hover{background:var(--coral)}
.handle{display:none}

/* 手機版 */
@media (max-width:800px){
  .brand{top:calc(10px + env(safe-area-inset-top,0px));left:10px;width:auto;max-width:calc(100% - 20px);padding:10px 60px 10px 14px}
  .brand h1{font-size:20px}
  .brand h1 small{display:inline;font-size:12px;letter-spacing:3px;margin-left:6px}
  .brand .eyebrow{display:none}
  .tools{flex-direction:column;top:calc(70px + env(safe-area-inset-top,0px));left:10px}
  .sheet{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;border-radius:22px 22px 0 0!important;padding-bottom:env(safe-area-inset-bottom,0px)}
  #card{height:var(--h,34%)}
  #side{height:var(--h,66%)}
  #side .side-list{padding:6px 14px calc(20px + env(safe-area-inset-bottom,0px));gap:10px}
  .side-top{padding:0 16px 6px}
  .side-title{font-size:30px}
  .dest{min-height:128px;padding:14px;gap:8px}
  .dest b{font-size:20px}
  .dest-ic{width:44px;height:44px;font-size:20px}
  .dest-sum{display:none}
  .dest.feature .dest-sum{display:block}
  .handle{display:block;width:100%;height:24px;border:0;background:transparent;cursor:grab;touch-action:none;flex:none;position:relative}
  .handle::after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:var(--stone)}
  .card-head{padding-top:0}
  #hud{display:none;flex-wrap:wrap;justify-content:center;white-space:normal;border-radius:22px;width:calc(100% - 20px);box-sizing:border-box;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  #hud.open{display:flex}
  #hud .sep{display:none}
  #timeBtn{display:inline-flex;position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--glass-strong);box-shadow:var(--shadow);border-radius:999px;padding:0 16px;font-weight:700}
  #log{top:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));right:10px!important;width:min(300px,calc(100% - 20px));max-height:30vh}
  #legend{bottom:calc(132px + env(safe-area-inset-bottom,0px));font-size:11px;gap:10px}
  body.sheet-open #legend{display:none}
}
@media (prefers-reduced-motion:reduce){ .live i{animation:none} #loader{transition:none} }
.ilabel.done::after{content:"✓";color:#3a8a5a;font-weight:900;margin-left:2px}

/* 故事場景：整個畫面換掉，像走進那座島 */
:root{ --serif:"Noto Serif TC","Songti TC","PMingLiU",serif; --gold:#e3bf6b; --karma:#b03a2e }
#stage{transition:filter .7s ease, transform .9s ease}
body.in-scene #stage{filter:blur(8px) saturate(.85) brightness(.72);transform:scale(1.05)}
/* 走進室內時：3D 房間清楚顯示，不模糊；文字放在深色半透明底上才讀得清楚 */
body.in-room #stage{filter:none;transform:none;transition:none}
#fade{position:fixed;inset:0;z-index:14;background:#fffaf2;opacity:0;transition:opacity .3s ease;pointer-events:none}
#scene.room{background:linear-gradient(180deg, rgba(20,14,10,.42) 0, rgba(20,14,10,0) 16%, rgba(20,14,10,0) 40%, rgba(20,14,10,.5) 100%)}
#scene.room .sc-title{font-size:clamp(20px,2.6vw,28px)}
#scene.room .sc-inner{margin:0 auto auto}
#scene.room .sc-titlecard{background:rgba(24,18,14,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 28px;border-radius:20px}
#scene.room .sc-choice{background:rgba(24,18,14,.62);border-color:rgba(255,255,255,.22)}
#scene.room .sc-choice:hover{background:rgba(24,18,14,.8)}
#scene.room .sc-picked{background:rgba(24,18,14,.6);border-color:rgba(255,255,255,.35)}
#scene.room .sc-eyebrow, #scene.room .sc-src{text-shadow:0 1px 8px #000a}
/* 同學頭上的驚嘆號 */
.sc-top{position:relative;z-index:4}
.sc-main{position:relative;z-index:2}
.sc-hand{position:relative;z-index:4}
.sc-dlg{z-index:2}
/* 驚嘆號要疊在中間那層上面，不然會被擋住點不到 */
.sc-marks{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.npc-mark{position:absolute;left:0;top:0;width:120px;height:120px;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;font:inherit;border-radius:50%}
.npc-mark .bang{position:absolute;left:50%;top:12px;margin-left:-14px;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:var(--ink);font:900 17px/1 var(--sans);display:grid;place-items:center;box-shadow:0 0 0 2px #fff,0 4px 10px #0005;animation:bang 1.3s ease-in-out infinite}
.npc-mark.talked .bang{background:#fff;color:#3a8a5a;animation:none}

// 平移範圍：鏡頭中心不離開城市太遠，免得滑到看不見島
const PAN_LIMIT = 10;
function clampPan() {
  const t = controls.target, dx = t.x - center.x, dz = t.z - center.z, d = Math.hypot(dx, dz);
  if (d <= PAN_LIMIT) return;
  const nx = center.x + dx * PAN_LIMIT / d, nz = center.z + dz * PAN_LIMIT / d;
  camera.position.x += nx - t.x; camera.position.z += nz - t.z;
  t.x = nx; t.z = nz;
}
function panBy(right, forward) {
  const dist = camera.position.distanceTo(controls.target) * .08;
  const r = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0).setY(0).normalize();
  const f = new THREE.Vector3(-r.z, 0, r.x);
  const move = r.multiplyScalar(right * dist).add(f.multiplyScalar(-forward * dist));
  camera.position.add(move); controls.target.add(move);
  clampPan(); dirty = true;
}
function overviewDist() {
  const a = innerWidth / Math.max(1, innerHeight);
  return a > 1.25 ? 23 : a > .8 ? 31 : 46;
}
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); css2d.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  for (const r of Object.values(roomCache)) if (r.cam) { r.cam.aspect = w / h; r.cam.updateProjectionMatrix(); }
  if (SC.open) layoutArt();
  dirty = true;
}

function makeWaterMat(wall) {
  return new THREE.ShaderMaterial({
    fog: true,
    uniforms: Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog), waterU, { uWall: { value: wall } }),
    polygonOffset: !!wall, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    vertexShader: `#include <fog_pars_vertex>
      varying vec3 vW;
      void main(){ vec4 wp = modelMatrix*vec4(position,1.); vW = wp.xyz; vec4 mvPosition = viewMatrix*wp; gl_Position = projectionMatrix*mvPosition;
      #include <fog_vertex>
      }`,
    fragmentShader: `#include <fog_pars_fragment>
      uniform vec3 uShallow,uDeep; uniform float uTime,uWall; uniform vec2 uCenter; varying vec3 vW;
      void main(){
        float d = length(vW.xz-uCenter);
        float w1 = sin(vW.x*.35+uTime*.4)*sin(vW.z*.3-uTime*.33);
        float w2 = sin((vW.x+vW.z)*.62+uTime*.7)*sin(vW.x*.21-uTime*.2);
        float k = clamp(smoothstep(9.,60.,d) + w1*.07 + w2*.05, 0., 1.);
        vec3 c = mix(uShallow, uDeep, k);
        float sp = pow(max(0., sin(vW.x*3.1+uTime*1.3)*sin(vW.z*2.7-uTime*1.1)), 22.)*.22*(1.-k);
        c += sp;
        if(uWall>.5){ c = mix(c, vec3(.98,.95,.9), clamp(.12 + (vW.y+.18)*.42, 0., .55)); }
        gl_FragColor = vec4(c,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`
  });
}
function updateClouds(dt) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
  let i = 0;
  for (const c of cloudData) {
    c.x += c.speed * dt;
    if (c.x > 80) c.x = -80;
    for (const f of c.puffs) {
      m.compose(p.set(center.x + c.x + f.x, c.y + f.y, center.z + c.z + f.z), q, s.set(f.s, f.s * .62, f.s));
      clouds.setMatrixAt(i++, m);
    }
  }
  clouds.instanceMatrix.needsUpdate = true;
}

/* ---------- 日夜 ---------- */
let keyCols = null;
function updateDay(force) {
  if (!keyCols) keyCols = KEYS.map(k => ({ m: k[0], top: new THREE.Color('#' + k[1]), hor: new THREE.Color('#' + k[2]), sun: new THREE.Color('#' + k[3]), sunI: k[4], hs: new THREE.Color('#' + k[5]), hg: new THREE.Color('#' + k[6]), hI: k[7], night: k[8], water: new THREE.Color('#' + k[9]) }));
  const m = clockMin;
  let i = 0; while (i < keyCols.length - 2 && keyCols[i + 1].m <= m) i++;
  const a = keyCols[i], b = keyCols[i + 1], f = clamp((m - a.m) / (b.m - a.m), 0, 1);
  const U = sky.material.uniforms;
  U.uTop.value.lerpColors(a.top, b.top, f);
  U.uHorizon.value.lerpColors(a.hor, b.hor, f);
  U.uSun.value.lerpColors(a.sun, b.sun, f);
  fog.color.copy(U.uHorizon.value);
  sun.color.copy(U.uSun.value); sun.intensity = mix(a.sunI, b.sunI, f);
  hemi.color.lerpColors(a.hs, b.hs, f); hemi.groundColor.lerpColors(a.hg, b.hg, f); hemi.intensity = mix(a.hI, b.hI, f);
  night = mix(a.night, b.night, f); U.uNight.value = night;
  waterU.uShallow.value.lerpColors(a.water, b.water, f);
  waterU.uDeep.value.copy(waterU.uShallow.value).multiplyScalar(.7);
  fill.intensity = .35 * (1 - night * .3);
  glowMat.emissiveIntensity = night * 1.9;
  poolMat.opacity = night * .2;
  shallowMat.color.copy(waterU.uShallow.value).lerp(colorOf('#ffffff'), .45 * (1 - night * .8));
  shallowMat.opacity = .5 * (1 - night * .5);
  foamMat.opacity = .55 * (1 - night * .6);
  for (const r of ridges) { r.material.color.copy(r.userData.base).lerp(fog.color, r.userData.k).multiplyScalar(1 - night * .5); }
  // 太陽方位：量化到 10 分鐘
  const qm = Math.floor(m / 10) * 10;
  if (force || qm !== updateDay.lastQ) {
    updateDay.lastQ = qm;
    const t = clamp((qm - 360) / 720, 0, 1);
    const az = Math.PI * (.15 + .7 * t), el = .35 + Math.sin(t * Math.PI) * .75;
    const dir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), .55 * Math.cos(el) + .35).normalize();
    sun.position.copy(center).addScaledVector(dir, 40);
    U.uSunDir.value.copy(dir);
  }
  const slot = DATA.dayCycle.find(s => m >= s.from && m < s.to) || DATA.dayCycle[0];
  if (slot !== curSlot) { curSlot = slot; applyHighlights(); $('#slotTxt').textContent = L(slot.name); refreshListHighlights(); }
  const txt = fmtTime(m);
  const ct = $('#clockTxt'); if (ct.textContent !== txt) ct.textContent = txt;
}

function builder(list, M, owner, small = false, rnd) {
  rnd = rnd || builder.rnd || (builder.rnd = mulberry32(1234));
  const q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
  const j = () => 1 + (rnd() * 2 - 1) * .0072;
  const b = {
    p(k, x, y, z, sx, sy, sz, c, ry = 0, rx = 0, rz = 0) {
      e.set(rx, ry, rz); q.setFromEuler(e);
      const m = new THREE.Matrix4().compose(p.set(x, y, z), q, s.set(sx * j(), sy * j(), sz * j()));
      m.premultiply(M);
      list.push({ k, m, c, owner, small });
    },
    box: (x, y, z, w, h, d, c, ry, rx, rz) => b.p('box', x, y, z, w, h, d, c, ry, rx, rz),
    rb: (x, y, z, w, h, d, c, ry) => b.p('rbox', x, y, z, w, h, d, c, ry),
    cyl: (x, y, z, r, h, c, rx = 0, rz = 0) => b.p('cylinder', x, y, z, r * 2, h, r * 2, c, 0, rx, rz),
    cone: (x, y, z, r, h, c) => b.p('cone', x, y, z, r * 2, h, r * 2, c),
    sph: (x, y, z, r, c, sy = 1) => b.p('sphere', x, y, z, r * 2, r * 2 * sy, r * 2, c),
    ico: (x, y, z, r, c, sy = 1) => b.p('ico', x, y, z, r * 2, r * 2 * sy, r * 2, c, rnd() * 3),
    dome: (x, y, z, r, c) => b.p('dome', x, y, z, r * 2, r * 2, r * 2, c),
    tor: (x, y, z, r, c, rx = 0, rz = 0) => b.p('torus', x, y, z, r * 2, r * 2, r * 2, c, 0, rx, rz),
    prism: (x, y, z, w, h, d, c, ry) => b.p('prism', x, y, z, w, h, d, c, ry),
    hip: (x, y, z, w, h, d, c, ry) => b.p('hip', x, y, z, w, h, d, c, ry),
    gb: (x, y, z, w, h, d, c = C.win) => b.p('glowbox', x, y, z, w, h, d, c),
    gs: (x, y, z, r, c = C.cream) => b.p('glowsphere', x, y, z, r * 2, r * 2, r * 2, c),
    sub(x, y, z, sc, ry, fn) {
      const M2 = M.clone().multiply(new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, 0)), new THREE.Vector3(sc, sc, sc)));
      fn(builder(list, M2, owner, small, rnd));
    },
    small: fn => fn(builder(list, M, owner, true, rnd))
  };
  return b;
}
function buildMeshes(list, shadows = true) {
  const groups = new Map();
  for (const e of list) { const key = e.k + (e.small ? '|s' : ''); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(e); }
  const out = [];
  for (const [key, arr] of groups) {
    const k = key.split('|')[0], glow = k.startsWith('glow');
    const mesh = new THREE.InstancedMesh(GEO[k], glow ? glowMat : solidMat, arr.length);
    const owners = new Array(arr.length);
    arr.forEach((e, i) => { mesh.setMatrixAt(i, e.m); mesh.setColorAt(i, colorOf(e.c)); owners[i] = e.owner; e.mesh = mesh; e.idx = i; });
    mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = shadows && !glow && !key.endsWith('|s');
    mesh.receiveShadow = true;
    mesh.userData = { owners, small: key.endsWith('|s') };
    mesh.computeBoundingSphere();
    out.push(mesh);
  }
  return out;
}

let beachWaves = [];
function buildBeach() {
  const E = 1.05, R0 = R - .05, Y0 = TOP - .004, Y1 = WATER_Y - .07;

    }

    apron.receiveShadow = true;
    scene.add(apron);

    const shore = new THREE.Mesh(hexRing(R0 + E - .12, R0 + E + .03), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .7, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }));
    shore.position.set(isl.x, WATER_Y + .02, isl.z); shore.renderOrder = 3;

      const m = new THREE.Mesh(hexRing(R0 + E - .03, R0 + E + .05), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }));
      m.position.set(isl.x, WATER_Y + .016, isl.z); m.renderOrder = 3;

/* =========================================================
   故事場景：點一座島，整個畫面換成那裡的故事
   GS 是這一世的狀態；陰德 merit 只在這裡記，畫面上不顯示。
   ========================================================= */
const GS = { merit: 0, realm: { hell: 0, ghost: 0, animal: 0, asura: 0 }, hand: [], karma: null, done: new Set() };
const SC = { open: false, isl: null, ch: null, beats: [], i: -1, after: null, waiting: false, typing: null, full: '', cb: null, origin: [0, 0], room: null, px: 0, py: 0 };
const paras = s => s.split('\n\n');
const NARR = () => tr('旁白', 'Narrator');

function enterScene(isl) {
  if (SC.open) { if ($('#scene').hidden) return; showScene(isl); return; }
  SC.open = true;
  closeCard(); setSel({ type: 'island', isl });
  _pv.set(isl.x, TOP + .4, isl.z).project(camera);
  const sx = clamp((_pv.x * .5 + .5) * innerWidth, 0, innerWidth), sy = clamp((-_pv.y * .5 + .5) * innerHeight, 0, innerHeight);
  if (show.bird) setBird(false, true);
  const t = new THREE.Vector3(isl.x, TOP + .2, isl.z);
  flyTo(t.clone().add(new THREE.Vector3(1, 1.8, 2.4)), t);
  setTimeout(() => openScene(isl, sx, sy), reduced ? 0 : 560);
}
function openScene(isl, sx, sy) {
  const s = $('#scene');
  SC.origin = [sx, sy];
  if (ROOMS[isl.d.id]) {
    // 有室內場景的地點：畫面先淡成白色，再換成那個地點的 3D 室內，像真的走進去
    fade(true, () => {
      s.style.transition = 'none'; s.style.clipPath = 'none';
      s.hidden = false; document.body.classList.add('in-scene');
      showScene(isl);
      fade(false);
      setTimeout(() => $('#scDlg').focus({ preventScroll: true }), 60);
    });
    return;
  }
  s.hidden = false;
  document.body.classList.add('in-scene');
  if (reduced) s.style.clipPath = 'none';
  else {
    s.style.transition = 'none'; s.style.clipPath = `circle(0px at ${sx}px ${sy}px)`;
    void s.offsetWidth;
    s.style.transition = ''; s.style.clipPath = `circle(150vmax at ${sx}px ${sy}px)`;
  }
  showScene(isl);
  setTimeout(() => $('#scDlg').focus({ preventScroll: true }), 60);
}
function exitScene() {
  if (!SC.open || $('#scene').hidden) return;
  clearInterval(SC.typing); SC.typing = null;
  const s = $('#scene'), [sx, sy] = SC.origin, isl = SC.isl;
  if (SC.room) {
    // 從室內走出來：淡成白色，回到島上，鏡頭再慢慢拉遠
    fade(true, () => {
      SC.room = null; SC.open = false;
      document.body.classList.remove('in-scene', 'in-room'); s.classList.remove('room', 'art', 'split'); s.hidden = true; hideArt();
      setSel({ type: null });
      focus(new THREE.Vector3(isl.x, TOP, isl.z), new THREE.Vector3(2.75, 5.3, 6.2), true);
      dirty = true;
      fade(false);
    });
    return;
  }
  document.body.classList.remove('in-scene');
  SC.open = false;
  if (reduced) s.hidden = true;
  else { s.style.clipPath = `circle(0px at ${sx}px ${sy}px)`; setTimeout(() => { if (!SC.open) s.hidden = true; }, 760); }
  setSel({ type: null }); // 回到主頁時不留下選取的標記和號碼
  focus(new THREE.Vector3(isl.x, TOP, isl.z), new THREE.Vector3(2.75, 5.3, 6.2), true);
  dirty = true;
}
function setMain(html) {
  const main = $('#scMain');
  main.innerHTML = `<div class="sc-inner">${html}</div>`;
  main.scrollTop = 0;
  if ($('#scHint').getAttribute('aria-pressed') === 'true') addHint();
}
function addHint() {
  if (!SC.ch || $('#scMain .sc-hintbox')) return;
  const q = document.createElement('blockquote');
  q.className = 'sc-hintbox';
  q.innerHTML = `${esc(SC.ch.hint.quote)}<cite>${esc(SC.ch.hint.source)}</cite>`;
  $('#scMain .sc-inner').prepend(q);
}
const titleCard = (eyebrow, title, small) => `<div class="sc-titlecard${small ? ' small' : ''}">${eyebrow ? `<div class="sc-eyebrow">${esc(eyebrow)}</div>` : ''}${title ? `<h2 class="sc-title">${esc(title)}</h2>` : ''}</div>`;

// 一個地點可以有好幾個故事：先玩還沒玩過的，全部玩過就輪流
const islStories = isl => ((isl.d.scene || {}).stories || []);
const islDone = isl => { const list = islStories(isl); return list.length > 0 && list.every(e => GS.done.has(e.story)); };
function pickStory(isl, replay) {
  const list = islStories(isl);
  if (!list.length) return null;
  if (replay && SC.entry && list.includes(SC.entry)) return SC.entry;
  const fresh = list.find(e => !GS.done.has(e.story));
  if (fresh) return fresh;
  isl.turn = ((isl.turn ?? -1) + 1) % list.length;
  return list[isl.turn];
}
function showScene(isl, replay) {
  clearInterval(SC.typing); SC.typing = null;
  SC.isl = isl;
  const sc = isl.d.scene || { type: 'soon' };
  const entry = sc.type === 'story' ? pickStory(isl, replay) : null;
  const ch = entry ? GAME.chapters[entry.story] : null;
  SC.entry = entry; SC.ch = ch;
  SC.room = getRoom(isl);
  document.body.classList.toggle('in-room', !!SC.room);
  $('#scene').classList.toggle('room', !!SC.room);
  $('#scene').classList.toggle('art', !!(SC.room && SC.room.art));
  $('#scene').classList.remove('split');
  if (SC.room && SC.room.art) showArt(SC.room.art); else hideArt();
  if (!SC.room) dirty = true;
  $('#scene').style.setProperty('--tint', isl.d.color);
  $('#scPlace').innerHTML = `<i style="background:${isl.d.color}"></i>${esc(L(isl.d.name))}`;
  const meta = entry && entry.meta ? entry.meta : sc.meta;
  $('#scMeta').textContent = meta ? L(meta) : '';
  $('#scHint').hidden = !ch; $('#scHint').setAttribute('aria-pressed', 'false');
  renderHand();
  hideMarks(); hideTip(); $('#scDlg').hidden = false;
  if (SC.room && SC.room.npcs) {
    // 有人可以點的室內：先自由看看，點頭上有「！」的人才開始
    explore(isl);
  } else if (ch) {
    startStory(ch, meta);
  } else if (sc.type === 'class') {
    setMain(titleCard(tr('人生的起點', 'WHERE LIFE STARTS'), L(isl.d.name)));
    play(GAME.teacher.map(t => ({ who: t.who, text: t.text, kind: 'teacher' })), showCollection);
  } else {
    setMain(titleCard(sc.meta ? L(sc.meta) : '', L(isl.d.name)));
    play([{ who: NARR(), text: tr(`「${L(isl.d.name)}」的故事還在寫，之後再來看看。`, 'This story is still being written. Come back later.') }], () => endPanel(isl, null));
  }
}
function startStory(ch, meta) {
  hideMarks(); hideTip();
  $('#scDlg').hidden = false; $('#scHint').hidden = false;
  artTalk(true); artDim(false);
  // 立體書場景把故事標題放到上面那一列，中間留給圖
  if (SC.room && SC.room.art) { $('#scMeta').textContent = (meta ? L(meta) + ' · ' : '') + ch.title; setMain(''); }
  else setMain(titleCard(meta ? L(meta) : '', ch.title));
  const beats = [];
  if (GS.karma) { beats.push({ who: tr('因果', 'Karma'), text: GS.karma, kind: 'karma' }); GS.karma = null; }
  paras(ch.text).forEach(p => beats.push({ who: NARR(), text: p }));
  play(beats, () => showChoices(ch));
  setTimeout(() => { $('#scDlg').focus({ preventScroll: true }); layoutArt(); }, 30);
}

/* ---------- 探索：場景裡只有一個「！」，點了才開始 ---------- */
// 先找還沒玩過的故事；都玩過就留第一個（打勾）；沒有故事的地方就留第一個可以聊天的人
function oneNpc(npcs, stories) {
  const withStory = npcs.filter(n => n.story && stories.some(e => e.story === n.story));
  return withStory.find(n => !GS.done.has(n.story)) || withStory[0] || npcs[0];
}
function showTip(text) { const t = $('#scTip'); t.textContent = text; t.hidden = false; }
function hideTip() { $('#scTip').hidden = true; }
function explore(isl) {
  clearInterval(SC.typing); SC.typing = null; SC.waiting = false;
  $('#scDlg').hidden = true;
  $('#scHint').hidden = true; $('#scHint').setAttribute('aria-pressed', 'false');
  const sc = isl.d.scene || {}, stories = islStories(isl);
  $('#scMeta').textContent = sc.meta ? L(sc.meta) : '';
  setMain('');
  const art = !!SC.room.art;
  const box = art ? $('#scArt .art-inner') : $('#scMarks');
  box.querySelectorAll('.npc-mark').forEach(e => e.remove());
  for (const n of SC.room.npcs) n.el = null;
  artTalk(false);
  const npc = oneNpc(SC.room.npcs, stories);
  const entry = npc.story ? stories.find(e => e.story === npc.story) : null;
  const done = entry && GS.done.has(entry.story);
  showTip(entry ? tr('點「！」開始', 'Tap “!” to begin') : tr('點「！」聊聊', 'Tap “!” to chat'));
  const b = document.createElement('button');
  b.className = 'npc-mark' + (npc.talked || done ? ' talked' : '');
  b.innerHTML = `<span class="bang" aria-hidden="true">${done ? '✓' : '！'}</span>`;
  b.setAttribute('aria-label', entry ? tr('開始故事', 'Start the story') : tr(`跟${npc.name}聊聊`, `Talk to ${npc.name}`));
  b.onclick = () => {
    if (entry) {
      SC.entry = entry; SC.ch = GAME.chapters[entry.story];
      $('#scMeta').textContent = L(entry.meta);
      return startStory(SC.ch, entry.meta);
    }
    hideTip(); hideMarks();
    $('#scDlg').hidden = false; artTalk(true);
    play(npc.lines.map(t => ({ who: npc.name, text: t })), () => { npc.talked = true; explore(isl); });
    setTimeout(layoutArt, 30);
  };
  if (art) { b.classList.add('on-art'); b.style.left = npc.x * 100 + '%'; b.style.top = npc.y * 100 + '%'; }
  npc.el = b; box.appendChild(b);
  if (!art) box.hidden = false;
}
// 結束對話：有「！」可以點的場景回到場景裡；沒有的話就回到島上
function endTalk() {
  if (SC.room && SC.room.npcs) explore(SC.isl); else exitScene();
}
function hideMarks() {
  const box = $('#scMarks'); if (box) { box.hidden = true; box.innerHTML = ''; }
  document.querySelectorAll('#scArt .npc-mark').forEach(e => e.remove());
}
function placeMarks(r) {
  const box = $('#scMarks');
  if (!r.npcs || box.hidden) return;
  for (const npc of r.npcs) {
    if (!npc.el) continue;
    _pv.copy(npc.head).project(r.cam);
    const x = (_pv.x * .5 + .5) * innerWidth, y = (-_pv.y * .5 + .5) * innerHeight;
    npc.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%)`;
  }
}

function shuffled(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function showChoices(ch) {
  artDim(true);
  setMain(titleCard('', ch.title, true) + `<div class="sc-choices">${shuffled(ch.choices.length).map((i, k) =>
    `<button class="sc-choice" data-c="${i}" style="animation-delay:${k * .07}s"><b>${'ABCDE'[k]}</b><span>${esc(ch.choices[i].text)}</span></button>`).join('')}</div>`);
  say({ who: NARR(), text: tr('你會怎麼做？', 'What will you do?') }, true);
  $('#scMain').querySelectorAll('.sc-choice').forEach(b => b.onclick = () => pick(ch, ch.choices[+b.dataset.c]));
}
function pick(ch, c) {
  artDim(true);
  GS.merit += c.merit || 0;
  if (c.realm) GS.realm[c.realm] += c.shorten ? 2 : 1;
  if (c.karma) GS.karma = c.karma;
  setMain(`<div class="sc-picked"><div class="sc-eyebrow">${tr('你的選擇', 'YOUR CHOICE')}</div><p>${esc(c.text)}</p></div>`);
  play(paras(c.result).map(p => ({ who: tr('結果', 'What happened'), text: p })), () => afterResult(ch, c));
}
function afterResult(ch, c) {
  const next = () => epilogue(ch);
  if (!c.cards || !c.cards.length) return next();
  c.cards.forEach(id => GS.hand.push(id));
  renderHand(c.cards);
  setMain(`<div class="sc-eyebrow">${tr('你得到了祝福卡', 'YOU RECEIVED')}</div><div class="sc-cards">${c.cards.map((id, k) =>
    `<div class="bcard" style="animation-delay:${k * .18}s"><span class="lb">${tr('祝福卡', 'BLESSING')}</span><span class="zi">${esc(GAME.cards[id].name)}</span><span class="seal">點滴</span></div>`).join('')}</div>`);
  play(c.cards.map(id => ({ who: tr('導師', 'Teacher') + `・${GAME.cards[id].name}`, text: GAME.cards[id].quote, kind: 'teacher' })), next);
}
function epilogue(ch) {
  if (!ch.epilogue) return endPanel(SC.isl, ch);
  const src = ch.epilogueSource;
  setMain(titleCard(tr('後來……', 'AFTERWARDS'), '', true) + (src ? `<div class="sc-src">${tr('出處：', 'Source: ')}${src.url ? `<a class="sc-src" href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.label)}</a>` : esc(src.label)}</div>` : ''));
  play(paras(ch.epilogue).map(p => ({ who: tr('後來……', 'Afterwards'), text: p, kind: 'epi' })), () => endPanel(SC.isl, ch));
}
function endPanel(isl, ch) {
  artDim(true); hideTip();
  if (ch && SC.entry) { GS.done.add(SC.entry.story); isl.label.el.classList.toggle('done', islDone(isl)); }
  const more = ch && islStories(isl).some(e => !GS.done.has(e.story));
  const notClass = (isl.d.scene || {}).type !== 'class';
  setMain(titleCard(L(isl.d.name), ch ? tr('這一段人生走完了', 'This part of life is done') : '', true) +
    `<div class="sc-actions"><button class="sc-btn primary" data-act="back">${tr('回到島上', 'Back to islands')}</button>` +
    (more ? `<button class="sc-btn" data-act="next">${tr('這裡的下一個故事', 'Next story here')}</button>` : '') +
    (ch ? `<button class="sc-btn" data-act="again">${tr('再走一次', 'Play again')}</button>` : '') +
    (notClass ? `<button class="sc-btn" data-act="class">${tr('去點滴在心頭教室', 'Visit the classroom')}</button>` : '') + `</div>`);
  say({ who: NARR(), text: ch ? tr('島上會留下你的點滴。回去看看，它亮起來了。', 'The island keeps your moments. Go back and see it glow.') : tr('先去別的島看看吧。', 'Try another island for now.') }, true);
}
function showCollection() {
  const counts = {}; GS.hand.forEach(id => counts[id] = (counts[id] || 0) + 1);
  const n = Object.keys(counts).length;
  const go = islands.filter(i => (i.d.scene || {}).type === 'story');
  setMain(titleCard(tr('你收集的點滴', 'YOUR MOMENTS'), `${n} / 12`, true) +
    `<div class="sc-grid">${Object.entries(GAME.cards).map(([id, c]) => `<div class="mcard${counts[id] ? '' : ' locked'}" title="${esc(c.name)}"><span class="zi">${esc(c.name)}</span>${counts[id] > 1 ? `<i>×${counts[id]}</i>` : ''}</div>`).join('')}</div>` +
    `<div class="sc-eyebrow">${tr('選一座島出發', 'PICK AN ISLAND')}</div><div class="sc-actions">${go.map(i => `<button class="sc-btn${islDone(i) ? '' : ' primary'}" data-go="${i.i}">${esc(L(i.d.name))}${islDone(i) ? ' ✓' : ''}</button>`).join('')}</div>`);
  say({ who: GAME.teacher[0].who, kind: 'teacher', text: n ? tr(`你已經收集了 ${n} 種祝福卡。還想去哪裡體驗？`, `You have ${n} kinds of blessing cards. Where to next?`) : tr('你手上還沒有卡片。選一座島，去人間走一走吧。', 'No cards yet. Pick an island and go live a little.') }, true);
}
function renderHand(fresh = []) {
  const counts = {}; GS.hand.forEach(id => counts[id] = (counts[id] || 0) + 1);
  const ids = Object.keys(counts);
  $('#scHand').innerHTML = `<span class="sc-hand-label">${tr('手上的卡片', 'CARDS')}</span>` + (ids.length
    ? ids.map(id => `<span class="mini-card${fresh.includes(id) ? ' new' : ''}">${esc(GAME.cards[id].name)}${counts[id] > 1 ? ` ×${counts[id]}` : ''}</span>`).join('')
    : `<span class="sc-hand-empty">${tr('還沒有卡片', 'None yet')}</span>`);
}

/* ---------- 對話框：一段一段打字出來，點一下或按 Enter 繼續 ---------- */
function typeText(text, cb) {
  const node = $('#scText');
  clearInterval(SC.typing); SC.full = text; SC.cb = cb;
  if (reduced) { node.textContent = text; SC.typing = null; cb && cb(); return; }
  let i = 0; node.textContent = '';
  SC.typing = setInterval(() => {
    i += 2; node.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(SC.typing); SC.typing = null; cb && cb(); }
  }, 30);
}
function skipType() {
  if (!SC.typing) return false;
  clearInterval(SC.typing); SC.typing = null;
  $('#scText').textContent = SC.full;
  const cb = SC.cb; cb && cb();
  return true;
}
function say(b, idle) {
  const d = $('#scDlg');
  d.className = 'sc-dlg' + (b.kind ? ' ' + b.kind : '') + (idle ? ' idle' : '');
  $('#scName').textContent = b.who || ''; $('#scName').hidden = !b.who;
  $('#scNext').hidden = true;
  if (idle) SC.waiting = false;
  typeText(b.text, () => { if (!idle) $('#scNext').hidden = false; });
  if (SC.room && SC.room.art) layoutArt();
}
function play(beats, after) { SC.beats = beats; SC.i = -1; SC.after = after; SC.waiting = true; advance(); }
function advance() {
  if (skipType()) return;
  if (!SC.waiting) return;
  SC.i++;
  if (SC.i >= SC.beats.length) { SC.waiting = false; const a = SC.after; SC.after = null; a && a(); return; }
  say(SC.beats[SC.i]);
}
function initScene() {
  $('#scBack').onclick = exitScene;
  $('#scDlg').addEventListener('click', advance);
  $('#scEnd').addEventListener('click', e => { e.stopPropagation(); endTalk(); });
  $('#scene').addEventListener('pointermove', e => { SC.px = e.clientX / innerWidth - .5; SC.py = e.clientY / innerHeight - .5; });
  $('#scHint').onclick = () => {
    const on = $('#scHint').getAttribute('aria-pressed') !== 'true';
    $('#scHint').setAttribute('aria-pressed', on);
    if (on) addHint(); else $('#scMain .sc-hintbox')?.remove();
  };
  $('#scMain').addEventListener('click', e => {
    const b = e.target.closest('[data-act],[data-go]');
    if (!b) return;
    if (b.dataset.go != null) return showScene(islands[+b.dataset.go]);
    if (b.dataset.act === 'back') exitScene();
    else if (b.dataset.act === 'again') { if (SC.room && SC.room.npcs && SC.ch) startStory(SC.ch, SC.entry && SC.entry.meta); else showScene(SC.isl, true); }
    else if (b.dataset.act === 'next') showScene(SC.isl);
    else if (b.dataset.act === 'class') showScene(islands.find(i => (i.d.scene || {}).type === 'class'));
  });
}

/* =========================================================
   室內場景：走進地點之後看到的 3D 房間
   ROOMS 裡有的地點才會走進室內；沒有的地點用模糊的小島當背景。
   ========================================================= */
/* =========================================================
   立體書場景：用圖片當場景，點進去時像立體書一樣翻開、立起來
   每個場景只放一個「！」，x、y 是它在整張圖上的位置（0～1，從左上角算），點在人的臉上
   crop 是圖上方、下方空白的比例，顯示時會裁掉
   portrait 是去背的人物圖：點了「！」之後背景變模糊，人物放大站到前面
   ========================================================= */
const ART = {
  sch: { src: 'art/classroom.jpg', portrait: 'art/girl_classroom.png', ratio: .8, crop: [.08, .13], fold: 72, npcs: [{ name: '教室', story: 'exam-cheating', x: .35, y: .42 }] },
  wrk: { src: 'art/office.jpg', ratio: .8, crop: [.135, .145], fold: 70, npcs: [{ name: '辦公室', story: 'med-website', x: .5, y: .38 }] },
  st:  { src: 'art/street.jpg', ratio: .8, crop: [.055, .15], fold: 68, npcs: [{ name: '咖啡店的女生', x: .33, y: .54, lines: ['今天天氣真好，坐在路邊喝杯咖啡，看看來來往往的人。', '這裡的故事還在寫，之後再來找我聊聊吧！'] }] },
  park: { src: 'art/park.jpg', ratio: .8, crop: [.1, .14], fold: 69, npcs: [{ name: '長椅上的女生', x: .31, y: .49, lines: ['旁邊這隻小貓每天都會來陪我坐一下。', '這裡的故事還在寫，之後再來看看。'] }] },
  bch: { src: 'art/beach.jpg', ratio: .8, crop: [.083, .14], fold: 66, npcs: [{ name: '戴草帽的女生', x: .385, y: .46, lines: ['這杯芒果汁超好喝！', '這裡的故事還在寫，先吹吹海風吧。'] }] },
  // 家裡有兩個故事：先出現還沒玩過的那一個（弟弟的手機遊戲、爸爸的投資群組）
  hom: { src: 'art/home.jpg', ratio: .8, crop: [.14, .155], fold: 67, npcs: [
    { name: '弟弟', story: 'mobile-game', x: .5, y: .5 },

let thumbR, thumbScene, thumbCam;
function renderThumb(it, canvas) {
  try {
    if (!thumbR) {
      thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      thumbR.setPixelRatio(2); thumbR.setSize(160, 160, false);
      thumbR.outputColorSpace = THREE.SRGBColorSpace; thumbR.toneMapping = THREE.ACESFilmicToneMapping;
      thumbScene = new THREE.Scene();
      thumbScene.add(new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.5));
      const d = new THREE.DirectionalLight(0xfff1de, 2.4); d.position.set(2, 4, 3); thumbScene.add(d);
      thumbCam = new THREE.PerspectiveCamera(30, 1, .1, 50);
    }
    const list = [], b = builder(list, new THREE.Matrix4(), null, false, mulberry32(7));
    b.cyl(0, -.08, 0, .8, .08, it.isl.d.ground);
    (MODELS[it.model] || MODELS.house)(b);
    const ms = buildMeshes(list, false); ms.forEach(m => thumbScene.add(m));
    const h = MODEL_H[it.model] || .8;
    thumbCam.position.set(1.55, 1.3 + h * .55, 2.45).multiplyScalar(.95 + h * .18);
    thumbCam.lookAt(0, h * .4, 0);
    thumbR.render(thumbScene, thumbCam);
    const g = canvas.getContext('2d'); g.clearRect(0, 0, canvas.width, canvas.height); g.drawImage(thumbR.domElement, 0, 0, canvas.width, canvas.height);
    ms.forEach(m => { thumbScene.remove(m); m.dispose(); });
  } catch (e) { console.warn('thumbnail failed', e); }
}

/* =========================================================

   ========================================================= */
function islIcon(isl, size = 44) { return `<span class="icon" style="background:${isl.d.color};width:${size}px;height:${size}px">${esc(isl.d.icon || L(isl.d.name).slice(0, 1))}</span>`; }
function flowChip(F) { return `<button class="chip cream" data-flow="${F.d.id}">${lineSample(F.level)}${esc(L(F.d.name))}</button>`; }
function bigFacts(it) {
  return it.facts.map(f => { const s = L(f), m = s.match(/\[([^\]]+)\]/); return m ? { big: m[1], label: plain(s) } : null; }).filter(Boolean).slice(0, 3);
}
function islandCard(isl) {
  const rel = flows.filter(F => F.A === isl || F.B === isl);
  return `<div class="card-title">${islIcon(isl)}<h2>${esc(L(isl.d.name))}</h2></div>
    <p class="lead">${esc(L(isl.d.summary))}</p>
    <div class="eyebrow">${tr('細項政策', 'POLICIES')} · ${isl.d.items.length}</div>
    <ul class="list">${isl.d.items.map((it, k) => `<li><button class="btn ${curSlot && curSlot.items.includes(it.id) ? 'lit' : ''}" data-item="${it.id}"><span class="n">${CIRC[k]}</span>${esc(L(it.name))}<span class="w">${esc(L(WHEN[it.when]))}</span></button></li>`).join('')}</ul>
    ${rel.length ? `<div class="eyebrow">${tr('協作', 'COLLABORATIONS')}</div><div class="chips">${rel.map(flowChip).join('')}</div>` : ''}`;
}
function itemCard(it) {
  const tiles = bigFacts(it), rel = flows.filter(F => F.A === it.isl || F.B === it.isl);
  const lit = curSlot && curSlot.items.includes(it.id);
  return `<div class="item-top"><canvas id="thumb" class="thumb" width="220" height="220" aria-hidden="true"></canvas><div><h2 style="margin:0 0 6px;font-size:21px;line-height:1.3;text-wrap:balance">${esc(L(it.name))}</h2><p class="lead" style="font-size:13px">${esc(L(it.desc))}</p></div></div>
    ${lit ? `<div class="chip" style="background:var(--yellow);box-shadow:none;align-self:flex-start;cursor:default">${tr('現在時段亮起', 'Active now')} · ${esc(L(curSlot.name))}</div>` : ''}
    <div class="tiles">${tiles.map(t => `<div class="tile"><b>${esc(t.big)}</b><span>${esc(t.label)}</span></div>`).join('')}</div>
    <div class="eyebrow">${tr('時程', 'TIMELINE')}</div>
    <div class="axis">${[1, 2, 3].map(w => `<div class="${w === it.when ? 'on' : ''}"><i></i>${esc(L(WHEN[w]))}</div>`).join('')}</div>
    <div class="chips"><button class="chip cream" data-island="${it.isl.i}">${tr('回到', 'Back to')} ${esc(L(it.isl.d.name))}</button>${rel.map(flowChip).join('')}</div>`;
}
function flowCard(F, w) {
  const f = F.d;
  return `${w ? `<p class="lead" style="font-weight:700">${esc(tr(`這位${L(ROLES[w.role].name)}正在搬${L(CARGO[f.cargo].name)}。`, `This ${L(ROLES[w.role].name)} is carrying ${L(CARGO[f.cargo].name)}.`))}</p>` : ''}
    <h2 style="margin:0;font-size:22px">${esc(L(f.name))}</h2>
    <div class="flowline"><button class="chip" data-island="${F.A.i}">${esc(L(F.A.d.name))}</button><span aria-hidden="true">→</span><button class="chip" data-island="${F.B.i}">${esc(L(F.B.d.name))}</button></div>
    <p class="lead">${esc(L(f.note))}</p>
    <dl class="kv">
      <dt>${tr('證據等級', 'Evidence')}</dt><dd><span class="ev">${lineSample(F.level)}${esc(L(LEVEL[F.level]))}</span></dd>
      <dt>${tr('搬運物', 'Cargo')}</dt><dd>${esc(L(CARGO[f.cargo].name))}</dd>
      <dt>${tr('走路的人', 'Walkers')}</dt><dd>${esc(L(ROLES[f.role].name))} × ${F.walkers.length}</dd>
      <dt>${tr('路線長度', 'Route')}</dt><dd>${F.len.toFixed(1)} ${tr('格', 'units')}</dd>
    </dl>`;
}
function openCard(html, eyebrow) {
  $('#cardEyebrow').textContent = eyebrow;
  $('#cardBody').innerHTML = html;
  $('#cardBody').scrollTop = 0;
  const card = $('#card');
  if (card.hidden) { card.hidden = false; if (isMobile) $('#side').hidden = true; syncSide(); }
  dirty = true;
}
function closeCard() { $('#card').hidden = true; syncSheets(); dirty = true; }
function refreshCard() {
  if ($('#card').hidden) return;
  if (sel.type === 'island') openCard(islandCard(sel.isl), `ISLAND ${String(sel.isl.i + 1).padStart(2, '0')}`);
  else if (sel.type === 'item') { openCard(itemCard(sel.item), `${String(sel.item.isl.i + 1).padStart(2, '0')} ${L(sel.item.isl.d.name)} · ${CIRC[sel.item.k]}`); renderThumb(sel.item, $('#thumb')); }
  else if (sel.type === 'flow') openCard(flowCard(sel.F), tr('協作線', 'COLLABORATION'));
  else if (sel.type === 'walker') openCard(flowCard(sel.F, sel.w), tr('搬運中的小人', 'WALKER'));
}
function refreshListHighlights() {
  document.querySelectorAll('[data-item]').forEach(b => b.classList.toggle('lit', !!curSlot && curSlot.items.includes(b.dataset.item)));
}

// 「要去哪？」面板：每個地點一張大卡片，中間的教室放最上面
function renderSide() {
  // 只放地點名稱，越簡單越好
  $('#sideList').innerHTML = islands.map(isl =>
    `<button class="dest" data-island="${isl.i}" style="--c:${isl.d.color}"><b>${esc(L(isl.d.name))}</b></button>`).join('');
}
function syncSheets() { document.body.classList.toggle('sheet-open', !$('#card').hidden || !$('#side').hidden); }
function syncSide() { syncSheets(); const open = !$('#side').hidden; $('#btnList').setAttribute('aria-pressed', open); document.body.classList.toggle('side-open', open && !isMobile); dirty = true; }
function renderLog() {
  const sel = $('#logFilter');
  if (!sel.options.length) {
    sel.innerHTML = `<option value="all">${tr('全部協作線', 'All links')}</option>` + flows.map(F => `<option value="${F.d.id}">${esc(L(F.d.name))}</option>`).join('');
    sel.value = logFilter;
  }
  const items = logEvents.filter(e => logFilter === 'all' || e.flow === logFilter);
  const K = { depart: tr('出發', 'DEPART'), arrive: tr('抵達', 'ARRIVE'), handoff: tr('交接', 'HANDOFF') };
  $('#logList').innerHTML = items.length ? items.map(e => `<li><button data-flow="${e.flow}"><time>${e.t}</time><span><span class="k">${K[e.kind]}</span>${esc(e.text)}</span></button></li>`).join('')
    : `<li class="empty">${tr('小人到站時，這裡會出現紀錄。', 'Walkers will report here when they reach a stop.')}</li>`;
}

function setToggle(id, on) { $(id).setAttribute('aria-pressed', on); }
function setBird(on, silent) {
  show.bird = on; setToggle('#tgBird', on);
  controls.minPolarAngle = on ? 0 : THREE.MathUtils.degToRad(25);
  if (silent) return;
  if (on) { const t = controls.target.clone(); flyTo(t.clone().add(new THREE.Vector3(.01, 42, 6)), t); }
  else goHome();
}
function goHome() {
  if (show.bird) setBird(false, true);
  flyTo(center.clone().addScaledVector(overviewDir, overviewDist()), center.clone());
}
function setTime(m) { clockMin = m; updateDay(true); dirty = true; }

function openIntro() { $('#intro').hidden = false; $('#introGo').focus(); }
function closeIntro() { $('#intro').hidden = true; lsSet('policyIsland.intro.v1', '1'); }

function bindSheet(el, defH) {
  const handle = el.querySelector('.handle');
  let startY = 0, startH = 0, drag = false;
  handle.addEventListener('pointerdown', e => { drag = true; startY = e.clientY; startH = el.getBoundingClientRect().height; handle.setPointerCapture(e.pointerId); });
  handle.addEventListener('pointermove', e => { if (!drag) return; const h = clamp(startH + (startY - e.clientY), 120, innerHeight); el.style.setProperty('--h', h + 'px'); });
  handle.addEventListener('pointerup', () => { if (!drag) return; drag = false; const h = el.getBoundingClientRect().height; if (h > innerHeight * .85) el.style.setProperty('--h', '100%'); else if (h < 140) { el.hidden = true; el.style.setProperty('--h', defH); if (el.id === 'side') syncSide(); } dirty = true; });
}

function buildUI() {
  renderSide();
  // 委派點擊：data-item / data-island / data-flow
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-item],[data-island],[data-flow]');
    if (!t || t.classList.contains('ilabel')) return;
    if (t.dataset.item) selectItem(itemById[t.dataset.item]);
    else if (t.dataset.island != null) selectIsland(islands[+t.dataset.island]);
    else if (t.dataset.flow) selectFlow(flows.find(F => F.d.id === t.dataset.flow));
    if (t.closest('#side')) { $('#side').hidden = true; syncSide(); }
  });
  $('#cardClose').onclick = clearSel;
  $('#btnHome').onclick = () => { clearSel(); goHome(); };
  $('#btnList').onclick = () => { const s = $('#side'); s.hidden = !s.hidden; if (!s.hidden) { renderSide(); closeCard(); s.querySelector('.dest')?.focus({ preventScroll: true }); } syncSide(); };
  $('#sideClose').onclick = () => { $('#side').hidden = true; syncSide(); };
  $('#btnHelp').onclick = openIntro;
  $('#introGo').onclick = closeIntro;
  document.querySelectorAll('[data-time]').forEach(b => b.onclick = () => setTime(+b.dataset.time));
  $('#tgTags').onclick = () => { show.tags = !show.tags; setToggle('#tgTags', show.tags); dirty = true; };
  $('#tgWalk').onclick = () => { show.walk = !show.walk; setToggle('#tgWalk', show.walk); dirty = true; };
  $('#tgFlows').onclick = () => { show.flows = !show.flows; setToggle('#tgFlows', show.flows); updateFlowStyles(); };
  $('#tgPause').onclick = () => { paused = !paused; setToggle('#tgPause', paused); dirty = true; };
  $('#tgBird').onclick = () => setBird(!show.bird);
  $('#tgLog').onclick = () => { show.log = !show.log; setToggle('#tgLog', show.log); $('#log').hidden = !show.log; if (show.log) renderLog(); dirty = true; };
  $('#logFilter').addEventListener('change', e => { logFilter = e.target.value; renderLog(); });
  $('#timeBtn').onclick = () => { const h = $('#hud'); h.classList.toggle('open'); $('#timeBtn').setAttribute('aria-expanded', h.classList.contains('open')); dirty = true; };
  $('#langBtn').onclick = () => {
    lang = lang === 'en' ? 'zh' : 'en';
    applyStaticLang(); refreshLabelText(); renderSide(); refreshCard(); updateFlowStyles();
    $('#slotTxt').textContent = curSlot ? L(curSlot.name) : '';
    $('#logFilter').innerHTML = ''; if (show.log) renderLog();
    if (pins.length) showPins(sel.item ? sel.item.isl : sel.isl);
  };
  bindSheet($('#card'), '34%'); bindSheet($('#side'), '52%');
  matchMedia('(max-width: 800px)').addEventListener?.('change', e => { isMobile = e.matches; syncSide(); dirty = true; });
}
</script>

</html>
